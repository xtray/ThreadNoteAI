name: Package Edge Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build offline package
        run: npm run pack

      - name: Upload offline package artifact
        uses: actions/upload-artifact@v4
        with:
          name: edge-offline-package-${{ github.ref_name }}
          path: artifacts/*.zip
          if-no-files-found: error
