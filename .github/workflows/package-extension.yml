name: Package Edge Extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build offline package
        run: npm run pack

      - name: Upload offline package artifact
        uses: actions/upload-artifact@v4
        with:
          name: edge-offline-package-${{ github.ref_name }}
          path: artifacts/*.zip
          if-no-files-found: error

  create-release:
    runs-on: ubuntu-latest
    needs:
      - package

    steps:
      - name: Download packaged artifact
        uses: actions/download-artifact@v4
        with:
          name: edge-offline-package-${{ github.ref_name }}
          path: release-assets

      - name: Create GitHub release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          name: ThreadNoteAI Edge Dev ${{ github.ref_name }}
          files: release-assets/*.zip
          overwrite_files: true
          fail_on_unmatched_files: true
          generate_release_notes: true
